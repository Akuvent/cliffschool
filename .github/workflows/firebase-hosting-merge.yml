name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: cliffschool
  # Replace after running scripts/setup-github-deploy.sh in Cloud Shell
  PROJECT_NUMBER: "725275517762"

jobs:
  deploy_live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to live channel
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: npx --yes firebase-tools@latest deploy --only hosting --project "${{ env.PROJECT_ID }}" --non-interactive
